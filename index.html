<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>jsTableBuilder - Standalone Raw Data Viewer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- jsTableBuilder CDN - Sir's Repository -->
   <script src="https://keshavsoft.github.io/jsTableBuilder/dist/v10/tableBuilder.umd.cjs"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col p-4 sm:p-8 font-sans">

    <div class="max-w-6xl w-full mx-auto space-y-6">

        <!-- Header & Input Panel -->
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8">

            <!-- Header -->
            <div class="relative">

                <!-- How to Use Button -->
                <a
                    href="./howtodo.html"
                    class="absolute right-0 top-0 inline-flex items-center gap-2
                           bg-gray-800 hover:bg-gray-900 text-white
                           font-semibold text-xs sm:text-sm
                           px-4 py-2 rounded-xl shadow transition-all"
                >
                    📖 How to Use
                </a>

                <div class="text-center">

                    <h1 class="text-4xl font-black text-gray-900 tracking-tight">
                        js<span class="text-blue-600">TableBuilder</span>
                    </h1>

                    <p class="text-gray-600 mt-2 text-base max-w-xl mx-auto">
                        Select a file or paste raw JSON — the table renders instantly below.
                    </p>

                </div>

            </div>


            <!-- Input Controls Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-5xl mx-auto mt-6">

                <!-- File Upload / Drag & Drop -->
                <div
                    id="dropZone"
                    class="border-2 border-dashed border-gray-300
                           hover:border-blue-500
                           bg-gray-50 hover:bg-blue-50/50
                           transition-all rounded-2xl p-6
                           flex flex-col items-center justify-center
                           cursor-pointer group"
                >

                    <input
                        type="file"
                        id="fileSelector"
                        accept=".json,.csv,.txt"
                        class="hidden"
                    >

                    <div
                        class="w-12 h-12 bg-white rounded-full
                               flex items-center justify-center
                               shadow-sm text-blue-600 mb-3
                               group-hover:scale-110 transition-transform"
                    >
                        <svg
                            class="w-6 h-6"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                            ></path>
                        </svg>
                    </div>

                    <p class="text-sm font-semibold text-gray-700">
                        Click to choose file or Drag & Drop
                    </p>

                    <p class="text-xs text-gray-400 mt-1">
                        Supports JSON & CSV files
                    </p>

                    <span
                        id="fileNameDisplay"
                        class="mt-2 text-xs font-semibold text-blue-600 hidden"
                    ></span>

                </div>


                <!-- JSON Paste Area -->
                <div class="flex flex-col text-left">

                    <div class="flex items-center justify-between mb-2">

                        <label
                            for="jsonTextarea"
                            class="text-xs font-bold text-gray-700
                                   uppercase tracking-wider"
                        >
                            Paste Raw JSON Array
                        </label>

                        <button
                            id="clearJsonBtn"
                            class="text-xs text-gray-400
                                   hover:text-red-500
                                   font-medium transition-colors"
                        >
                            Clear
                        </button>

                    </div>

                    <textarea
                        id="jsonTextarea"
                        rows="4"
                        placeholder='Paste JSON array here, e.g. [{"id":1, "name":"Item A", "amount":500}]'
                        class="w-full bg-gray-50 border border-gray-200
                               rounded-xl p-3 text-xs font-mono
                               text-gray-800
                               focus:ring-2 focus:ring-blue-500
                               focus:bg-white outline-none
                               resize-none transition-all"
                    ></textarea>

                    <button
                        id="renderJsonBtn"
                        class="mt-2 bg-indigo-600
                               hover:bg-indigo-700 text-white
                               font-semibold text-xs py-2 px-4
                               rounded-lg shadow transition-colors"
                    >
                        🚀 Render Pasted JSON
                    </button>

                </div>

            </div>


            <!-- Sample Dataset Buttons -->
            <div
                class="flex flex-wrap items-center justify-center
                       gap-3 pt-6 mt-6 border-t border-gray-100"
            >

                <button
                    id="loadEsgBtn"
                    class="bg-blue-600 hover:bg-blue-700
                           text-white font-semibold
                           text-xs sm:text-sm
                           px-5 py-2.5 rounded-xl
                           shadow transition-all"
                >
                    ⚡ Sample ESG Data
                </button>

                <button
                    id="loadEmployeesBtn"
                    class="bg-emerald-600 hover:bg-emerald-700
                           text-white font-semibold
                           text-xs sm:text-sm
                           px-5 py-2.5 rounded-xl
                           shadow transition-all"
                >
                    📁 Sample Employee Dataset
                </button>

            </div>


            <!-- Status Alert -->
            <div
                id="statusAlert"
                class="hidden text-sm font-medium p-3 rounded-xl mt-5"
            ></div>

        </div>


        <!-- Rendered Table -->
        <div
            id="table-container"
            class="bg-white rounded-2xl border border-gray-200
                   shadow-sm p-6 min-h-[300px]"
        >

            <div
                id="table-root"
                class="flex flex-col items-center
                       justify-center min-h-[240px]
                       text-gray-400
                       border border-dashed
                       border-gray-200 rounded-xl
                       p-8 text-center"
            >

                <svg
                    class="w-12 h-12 mb-2 text-gray-300"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                    ></path>
                </svg>

                <span class="text-sm font-semibold text-gray-600">
                    No data loaded yet
                </span>

                <span class="text-xs text-gray-400 mt-1 max-w-sm">
                    Select a file above, paste a JSON array,
                    or click a sample button to render the interactive table.
                </span>

            </div>

        </div>

    </div>


    <!-- Application Script -->
    <script src="./app.js"></script>

</body>

</html>
